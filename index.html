<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 拡大を禁止しない。誤ズーム防止より「見えづらい子が拡大できない」害のほうが大きい。
       誤ズームは touch-action: manipulation と、手書き領域の touch-action: none で防ぐ。
       ⚠️ viewport は Main.gs の addMetaTag にもある。片方だけ直しても効かないので必ず両方直すこと。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>ふりかえりジャーナル</title>

  <script>
    // GAS テンプレートが評価する行。doGet(Main.gs) が渡すブート情報。
    // GAS の外（手元のプレビュー）で開いた場合はこの行が構文エラーになるので、
    // 次の <script> でフォールバックを入れている。
    window.BOOT = <?!= bootJson ?>;
  </script>
  <script>
    if (!window.BOOT || typeof window.BOOT !== 'object') {
      window.BOOT = { mode: 'owner', className: 'ふりかえりジャーナル', signedIn: true, setupDone: true, webAppUrl: '' };
    }
  </script>

  <!-- 実行コード（React / ReactDOM / canvas-confetti）は自分側に持つ。
       学校のネットワークが unpkg / jsDelivr / cdn.tailwindcss.com を塞いでいても画面が出るようにするため。
       生成物なので手で編集しない（npm run build で作り直す）。 -->
  <?!= include('vendor'); ?>
  <!-- QR生成は先生の画面だけ。児童端末の初回JSには含めない。 -->
  <? if (bootMode === 'owner') { ?><?!= include('qr'); ?><? } ?>
  <?!= include('css'); ?>

  <!-- フォントは「届かなくても字の形が変わるだけ」なので CDN のままでよい。
       ただし端末側の日本語フォントを必ず後ろに並べる（tools/extra.css の --font-ui）。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    // ==========================================
    // サーバー呼び出し
    //
    // 以前はこの画面を GitHub Pages のシェルが iframe で包み、Google ログインの
    // ID トークンを postMessage で渡していた。いまはコンテナバインドで
    // 先生ごとにデプロイするため、開いているアカウントがそのまま本人になる。
    // ハンドシェイクもクラスコードも要らない（Main.gs の見出しを参照）。
    // ==========================================
    (function () {
      /** サーバーは必ず JSON 文字列を返す */
      window.runGas = function (fn) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          if (typeof google === 'undefined' || !google.script) { reject(new Error('サーバーに接続できません')); return; }
          google.script.run
            .withSuccessHandler(function (res) {
              try { resolve(JSON.parse(res)); } catch (e) { resolve(res); }
            })
            .withFailureHandler(reject)[fn].apply(google.script.run, args);
        });
      };

      window.callOwnerApi = function () {
        return window.runGas.apply(null, arguments);
      };

      window.callMemberApi = function () {
        return window.runGas.apply(null, arguments);
      };

      /**
       * 40 人が同時に提出すると LockService の取り合いになる。
       * LOCK_BUSY だけを指数バックオフでやり直す（児童は何もしなくてよい）。
       */
      window.callMemberApiWithBackoff = async function () {
        var args = Array.prototype.slice.call(arguments);
        var delay = 300;
        for (var i = 0; ; i++) {
          var res = await window.callMemberApi.apply(null, args);
          if (res && !res.success && res.code === 'LOCK_BUSY' && i < 3) {
            await new Promise(function (r) { setTimeout(r, delay); });
            delay *= 2;
            continue;
          }
          return res;
        }
      };

      // 再読み込み。GAS は画面を iframe で包むので、自分の location を触ると
      // 外枠だけが残る。google.script.host.setWidth のような外枠 API は
      // ここでは使えないため、同一オリジンの自分自身を読み直す。
      window.appReload = function () {
        try { window.location.reload(); } catch (e) {}
      };
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- 本編。JSX の翻訳はビルド時に済ませてある（原本は src/app.jsx）。 -->
  <?!= include('app'); ?>
</body>
</html>
