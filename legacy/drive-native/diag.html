<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>接続診断 — ふりかえりジャーナル</title>
  <script src="./config.js"></script>
  <style>
    body { margin: 0; padding: 24px; background: #f8fafc; color: #1f2937; font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; }
    main { max-width: 720px; margin: auto; }
    .item { margin: 12px 0; padding: 16px 20px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; }
    .ok { color: #047857; font-weight: 900; } .ng { color: #b91c1c; font-weight: 900; }
    p { line-height: 1.8; } a { color: #1d4ed8; font-weight: 800; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (forced-colors: active) { .item { border: 2px solid CanvasText; } }
  </style>
</head>
<body><main><h1>🔧 接続診断</h1><p>GitHub PagesとGoogleログインを利用できるブラウザか確認します。Google Drive APIの有効化と学校の管理ポリシーは、アプリ本体でログインして確認してください。</p><div id="results"></div><p><a href="./">← アプリに戻る</a></p></main>
<script>
(function () {
  var results = document.getElementById('results');
  var cfg = window.APP_CONFIG || {};
  function add(title, ok, detail) {
    var item = document.createElement('div');
    item.className = 'item';
    var heading = document.createElement('strong');
    heading.textContent = title + ': ';
    var status = document.createElement('span');
    status.className = ok ? 'ok' : 'ng';
    status.textContent = ok ? 'OK' : 'NG';
    heading.appendChild(status);
    item.appendChild(heading);
    var text = document.createElement('p');
    text.textContent = detail;
    item.appendChild(text);
    results.appendChild(item);
  }
  add('HTTPS', location.protocol === 'https:', location.protocol === 'https:' ? '安全な接続です。' : 'GitHub PagesのHTTPS URLを開いてください。');
  add('共通URL', /^https:\/\//.test(cfg.publicEntryUrl || ''), cfg.publicEntryUrl || 'docs/config.js に設定がありません。');
  add('OAuthクライアントID', /\.apps\.googleusercontent\.com$/.test(cfg.googleClientId || ''), cfg.googleClientId ? '形式を確認できました。' : 'docs/config.js に設定がありません。');
  add('Web Crypto', !!(window.crypto && window.crypto.subtle), '招待情報とクラスIDの生成に使います。');
  add('画像処理', typeof createImageBitmap === 'function', '添付画像を端末内で縮小する機能です。');
  var script = document.createElement('script');
  script.src = 'https://accounts.google.com/gsi/client';
  script.onload = function () { add('Googleログイン', true, 'Google Identity Servicesを読み込めました。'); };
  script.onerror = function () { add('Googleログイン', false, '学校のネットワークで accounts.google.com が許可されているか確認してください。'); };
  document.head.appendChild(script);
})();
</script></body></html>
