# CI — pull_request と push の両方で動かす。
# push: branches: [main] だけだと、PR の時点で落ちていることに気づけない。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: ビルド（原本 → GAS へ貼る生成物）
        run: npm run build

      - name: 生成物が原本と一致しているか
        run: node scripts/check-generated.mjs

      # 配信物を変えたのに版が据え置きだと、古いシェルのキャッシュが掃除されず、
      # 直した画面が端末に一度も届かない。2026-08-21 に12リポジトリで同時に起きた事故。
      - name: Service Worker の版が先読み一覧と一致しているか
        run: node tools/build-sw.mjs --check

      - name: QR・GASの認可とシートの点検・退役版の回帰テスト
        run: npm test

      - name: 品質ゲート（GIGA Standard v5 Part I ＋ GAS の G1〜G8）
        run: npm run check

      - name: 品質ゲート自体が動いているか（わざと壊して落ちることを見る）
        run: node scripts/selftest-check.mjs

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: 基本依存を入れる
        run: npm ci
      - name: Chromiumテスト環境を入れる
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: 導入案内ページと退役版UIのE2E
        run: npx playwright test

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
